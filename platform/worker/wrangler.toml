name = "applet-platform"
main = "index.ts"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "applet-platform-db"
database_id = "54c58c42-5bdb-468f-bd15-e25d7dbdb293"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "applet-platform-assets"

[triggers]
crons = ["*/5 * * * *"]

# SPA 静态资源（Workers Builds 构建产物 platform/dist）；未匹配路径回 index.html
[assets]
directory = "../dist"
binding = "ASSET_FILES"
not_found_handling = "single-page-application"
# Assets 层默认会拦截"导航类"请求直接回 SPA（Worker 不执行）——沙箱 iframe
# 导航因此拿不到 cookie 变空白。全部请求先过 Worker，由 worker 路由决定。
run_worker_first = true
