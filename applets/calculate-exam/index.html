<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>🧮 心算训练</title>
<link rel="stylesheet" href="./assets/style.css" />
</head>
<body>

<!-- 页面容器：手机优先，电脑端自动放大为居中卡片 -->
<div class="stage" id="stage">

  <!-- ============ 页面一：首页 ============ -->
  <section class="page page-home is-active" id="page-home">
    <!-- 卡通标题区 -->
    <header class="hero">
      <div class="hero-badge" aria-hidden="true">
        <span class="abacus">🧮</span>
      </div>
      <h1 class="logo">
        <span class="logo-c">心</span><span class="logo-a">算</span><span class="logo-t">训</span><span class="logo-l">练</span>
      </h1>
      <div class="hero-tags">
        <span class="tag" title="五个难度级别">🎚️ 5 级</span>
        <span class="tag" title="每次测试固定 100 道题">💯 100 题</span>
        <span class="tag" title="每级独立 TOP10 排行榜">🏆 排行榜</span>
      </div>
    </header>

    <!-- 排行榜轮播 Banner -->
    <div class="banner" id="banner">
      <div class="banner-head">
        <div class="banner-title" id="bannerTitle">🏆 菜鸟榜</div>
        <div class="banner-hint" title="5 秒自动切换，也可左右滑动">⏱︎ 自动轮播 · 可滑动</div>
      </div>
      <div class="banner-viewport" id="bannerViewport">
        <div class="banner-track" id="bannerTrack"><!-- 由脚本注入 5 个榜单 --></div>
      </div>
      <div class="banner-dots" id="bannerDots"><!-- 由脚本注入圆点 --></div>
    </div>

    <!-- 开始按钮 -->
    <button class="btn-primary btn-start" id="btnStart" type="button">
      <span class="btn-emoji" aria-hidden="true">🚀</span>
      <span class="btn-text">开始测试</span>
    </button>

    <!-- 悬浮提示条（图标化说明，避免长文案） -->
    <div class="tips-row">
      <span class="tip" title="答对 +3 分">✅ +3</span>
      <span class="tip" title="答错 -2 分">❌ -2</span>
      <span class="tip" title="时间分 = 100000 ÷ 用时秒数">⚡ 速度分</span>
    </div>
  </section>

  <!-- ============ 页面二：测试设置 ============ -->
  <section class="page page-setup" id="page-setup">
    <div class="bar">
      <button class="btn-icon" id="btnSetupBack" type="button" title="返回首页">←</button>
      <div class="bar-title">选择难度</div>
      <span class="bar-emoji" title="每次随机 100 道题">🎯</span>
    </div>

    <div class="level-list" id="levelList"><!-- 由脚本注入 5 个级别卡片 --></div>

    <button class="btn-primary btn-go" id="btnGo" type="button">
      <span class="btn-emoji" aria-hidden="true">⚡</span>
      <span class="btn-text">开始挑战</span>
    </button>
  </section>

  <!-- ============ 页面三：答题 ============ -->
  <section class="page page-quiz" id="page-quiz">
    <div class="bar">
      <button class="btn-icon" id="btnQuizQuit" type="button" title="放弃并返回首页">✕</button>
      <div class="bar-title"><span id="quizLevelName">菜鸟</span></div>
      <div class="bar-timer" id="quizTimer" title="本题累计用时">0:00</div>
    </div>

    <!-- 进度条 + 已做/剩余 + 正确率 -->
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-meta">
        <span class="pm-item" title="已答题数">✅ <b id="doneCount">0</b></span>
        <span class="pm-item" title="剩余题数">⏳ <b id="leftCount">100</b></span>
        <span class="pm-item" title="当前正确率">🎯 <b id="accRate">--</b></span>
      </div>
    </div>

    <!-- 题目卡片 -->
    <div class="quiz-card">
      <div class="q-index" id="qIndex">第 1 题</div>
      <div class="q-expr" id="qExpr">1 + 1</div>
      <div class="q-input-wrap">
        <span class="q-equal" aria-hidden="true">=</span>
        <input class="q-input" id="qInput" type="text" inputmode="numeric" autocomplete="off"
               autocapitalize="off" spellcheck="false" placeholder="?" />
      </div>
    </div>

    <button class="btn-primary btn-next" id="btnNext" type="button">
      <span class="btn-text">下一题</span>
      <span class="btn-emoji" aria-hidden="true">␣</span>
    </button>

    <!-- 对错反馈层：动态图像 + 约 1 秒后自动进入下一题 -->
    <div class="feedback" id="feedback" aria-hidden="true">
      <div class="fb-burst" id="fbBurst"></div>
      <div class="fb-emoji" id="fbEmoji">🎉</div>
      <div class="fb-word" id="fbWord">答对了</div>
      <div class="fb-truth" id="fbTruth"></div>
    </div>
  </section>

  <!-- ============ 页面四：结算 ============ -->
  <section class="page page-result" id="page-result">
    <div class="result-scroll">
      <!-- 名次徽章 -->
      <div class="rank-badge" id="rankBadge">
        <span class="rb-crown" id="rbCrown">👑</span>
        <span class="rb-num" id="rbNum">--</span>
        <span class="rb-label" id="rbLabel">名</span>
      </div>

      <!-- 炫酷标语（进榜才有） -->
      <div class="cheer" id="cheer"></div>

      <!-- 分数面板 -->
      <div class="score-panel">
        <div class="sp-main"><span id="totalScore">0</span><small>分</small></div>
        <div class="sp-grid">
          <div class="sp-cell" title="答对 +3 分，答错 -2 分">
            <span class="sp-emoji">✅</span><b id="accScore">0</b><small>正确分</small>
          </div>
          <div class="sp-cell" title="时间分 = 100000 ÷ 用时秒数">
            <span class="sp-emoji">⚡</span><b id="timeScore">0</b><small>速度分</small>
          </div>
          <div class="sp-cell" title="用时">
            <span class="sp-emoji">⏱︎</span><b id="costTime">0:00</b><small>用时</small>
          </div>
          <div class="sp-cell" title="正确率">
            <span class="sp-emoji">🎯</span><b id="accFinal">0%</b><small>正确率</small>
          </div>
        </div>
      </div>

      <!-- 排行榜（未进前十时展示简化版并高亮自己） -->
      <div class="mini-board">
        <div class="mb-title" id="mbTitle">🏆 榜单</div>
        <div class="mb-list" id="mbList"></div>
      </div>
    </div>

    <div class="result-actions">
      <button class="btn-primary btn-again" id="btnAgain" type="button">
        <span class="btn-emoji" aria-hidden="true">🔥</span><span class="btn-text">再战一次</span>
      </button>
      <button class="btn-ghost btn-home" id="btnHome" type="button">
        <span class="btn-emoji" aria-hidden="true">🏠</span><span class="btn-text">返回首页</span>
      </button>
    </div>

    <!-- 全屏庆祝特效层 -->
    <div class="fx-layer" id="fxLayer" aria-hidden="true"></div>
  </section>

  <!-- 通用轻提示 -->
  <div class="toast" id="toast"></div>
</div>

<!-- 平台运行时：注入凭据与数据接口，必须引入 -->
<script src="/app-runtime.js"></script>
<script src="./assets/core.js"></script>
<script src="./assets/questions.js"></script>
<script src="./assets/store.js"></script>
<script src="./assets/ui.js"></script>
<script src="./assets/app.js"></script>
</body>
</html>
