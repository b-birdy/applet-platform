<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>背单词</title>
  <link rel="stylesheet" href="./assets/style.css">
  <script src="/app-runtime.js"></script>
</head>
<body>
  <main class="wrap">
    <header class="head">
      <h1>背单词</h1>
      <span id="stats" class="stats"></span>
    </header>

    <form id="add-form" class="add">
      <input id="word" name="word" placeholder="单词" required autocomplete="off">
      <input id="meaning" name="meaning" placeholder="释义（可选）" autocomplete="off">
      <button type="submit" class="btn primary">添加</button>
    </form>
    <p id="error" class="error" hidden></p>

    <ul id="list" class="list" aria-live="polite"></ul>
    <p id="empty" class="empty" hidden>还没有单词。添加第一个吧。</p>
  </main>
  <script src="./assets/main.js"></script>
</body>
</html>
